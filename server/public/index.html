<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>NYAWIT LIVE 3D — Multiplayer Sawit & Truk Canter Arena</title>
  <meta name="description" content="Game 3D Live Multiplayer Panen Kelapa Sawit & Balap Setoran Truk Canter ke PKS. Real-time Chat, Global Ranking, Kustomisasi Avatar 3D, Reward Harian & Turnamen Mingguan." />
  <meta property="og:title" content="NYAWIT LIVE 3D — Live Multiplayer Plantation Arena" />
  <meta property="og:description" content="Main bareng real-time lintas Android Native C# APK & Browser! Panen TBS & Sawit Emas, angkut Truk Canter, setor ke Pabrik PKS & raih Mahkota Raja Sawit!" />
  <meta property="og:image" content="https://nyawit.xyverse.my.id/assets/og_banner.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon_website_16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon_website_32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon_website_48.png" />
  <link rel="apple-touch-icon" href="/brand/icon_apple_touch_180.png" />
  <style>
    @font-face {
      font-family: 'XyVerse Display';
      src: url('/brand/XyVerseDisplay-Semibold.woff2') format('woff2');
      font-weight: 600;
      font-display: swap;
    }
    :root {
      --bg: #0D0D0D;
      --panel: rgba(13, 16, 15, 0.88);
      --border: rgba(92, 224, 146, 0.28);
      --green: #22c55e;
      --gold: #facc15;
      --text: #f3f7f5;
      --muted: #93a89d;
    }
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0D0D0D; color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    canvas#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    canvas#labels2d { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

    /* Top HUD Bar */
    .hud-top { position: fixed; top: 10px; left: 12px; right: 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; pointer-events: none; z-index: 20; }
    .hud-top > * { pointer-events: auto; }
    .left-stack { display: flex; gap: 10px; align-items: flex-start; }
    canvas#minimap { width: 112px; height: 112px; border-radius: 14px; background: rgba(10, 18, 14, 0.85); border: 2px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
    .perf-box { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px 11px; font-size: 11px; line-height: 1.45; }
    .perf-title { font-family: 'XyVerse Display', sans-serif; font-size: 13px; color: #fff; display: flex; align-items: center; gap: 7px; letter-spacing: .04em; }
    .perf-title img { width: 16px; height: 16px; }
    .pill-row { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
    .chip { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #d8e6de; padding: 3px 8px; border-radius: 7px; font-size: 10px; font-weight: 700; cursor: pointer; }
    .chip.active { background: var(--green); color: #07130c; border-color: var(--green); }

    .event-banner { background: rgba(11, 15, 13, 0.95); border: 1px solid rgba(250, 204, 21, 0.52); border-radius: 14px; padding: 8px 16px; text-align: center; min-width: 240px; box-shadow: 0 8px 28px rgba(0,0,0,.55); }
    .event-tag { font-family: 'XyVerse Display', sans-serif; font-size: 12px; color: var(--gold); letter-spacing: .05em; }
    .wallet-row { display: flex; justify-content: center; gap: 14px; margin-top: 4px; font-size: 12px; font-weight: 700; }
    .wallet-row b.rp { color: #4ade80; }
    .wallet-row b.tbs { color: #fb923c; }
    .wallet-row b.gem { color: #38bdf8; }

    .menu-buttons { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 430px; }
    .mbtn { background: var(--panel); border: 1px solid var(--border); color: #fff; border-radius: 11px; padding: 8px 11px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; transition: transform .08s; }
    .mbtn:active { transform: scale(.95); }
    .mbtn.gold { border-color: rgba(250,204,21,.6); color: var(--gold); }
    .mbtn.apk { background: #eab308; color: #111; border-color: #eab308; text-decoration: none; }
    .badge-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; display: inline-block; }

    /* Live Mini Chat Feed Overlay */
    .chat-dock { position: fixed; left: 12px; bottom: 170px; width: 290px; max-height: 155px; background: rgba(11, 15, 13, 0.72); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 5px; z-index: 18; backdrop-filter: blur(6px); }
    .chat-list { overflow-y: auto; flex: 1; font-size: 11.5px; line-height: 1.35; display: flex; flex-direction: column; gap: 3px; user-select: text; }
    .chat-item b { color: #5ce092; }
    .chat-item .tag { color: var(--gold); font-size: 10px; margin-right: 4px; }
    .chat-input-row { display: flex; gap: 5px; }
    .chat-input-row input { flex: 1; background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.16); border-radius: 8px; padding: 6px 9px; color: #fff; font-size: 12px; user-select: text; outline: none; }
    .chat-input-row button { background: var(--green); color: #06140b; border: 0; border-radius: 8px; padding: 0 11px; font-weight: 800; cursor: pointer; font-size: 11px; }

    /* Touch Joystick & Tactical Action Cluster */
    .joy-zone { position: fixed; left: 22px; bottom: 20px; width: 132px; height: 132px; border-radius: 50%; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.18); z-index: 19; touch-action: none; }
    .joy-knob { position: absolute; left: 41px; top: 41px; width: 50px; height: 50px; border-radius: 50%; background: rgba(34, 197, 94, 0.85); box-shadow: 0 4px 16px rgba(34,197,94,.45); pointer-events: none; }

    .action-cluster { position: fixed; right: 18px; bottom: 18px; display: grid; grid-template-columns: repeat(2, auto); gap: 9px; align-items: end; z-index: 19; }
    .abtn { border: 2px solid rgba(255,255,255,.22); border-radius: 50%; width: 68px; height: 68px; background: rgba(15, 22, 18, 0.88); color: #fff; font-weight: 800; font-size: 10.5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 8px 22px rgba(0,0,0,.5); }
    .abtn.harvest { width: 88px; height: 88px; background: radial-gradient(circle, #22c55e, #15803d); color: #05140a; border-color: #86efac; font-size: 12px; }
    .abtn.sell { background: radial-gradient(circle, #facc15, #ca8a04); color: #171203; border-color: #fef08a; }
    .abtn:active { transform: scale(.93); }

    /* Center Toast */
    .toast { position: fixed; top: 88px; left: 50%; transform: translateX(-50%); background: rgba(13, 18, 15, 0.94); border: 1px solid var(--gold); color: #fff; padding: 9px 18px; border-radius: 999px; font-weight: 700; font-size: 13px; z-index: 50; pointer-events: none; opacity: 0; transition: opacity .22s; text-align: center; }
    .toast.show { opacity: 1; }

    /* Modal Drawer System */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 60; display: none; align-items: center; justify-content: center; padding: 14px; }
    .modal-backdrop.open { display: flex; }
    .modal { width: 100%; max-width: 680px; max-height: 86vh; background: #121715; border: 1px solid #2b4d3b; border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 28px 70px rgba(0,0,0,.75); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #0D0D0D; border-bottom: 1px solid #22352b; }
    .modal-head h2 { font-family: 'XyVerse Display', sans-serif; margin: 0; font-size: 19px; letter-spacing: .05em; }
    .close-btn { background: rgba(255,255,255,.1); color: #fff; border: 0; width: 32px; height: 32px; border-radius: 9px; font-weight: 800; cursor: pointer; }
    .modal-body { padding: 18px 20px; overflow-y: auto; user-select: text; }

    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .option-group { margin-bottom: 14px; }
    .option-group label { display: block; font-size: 11px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
    .opt-pills { display: flex; gap: 7px; flex-wrap: wrap; }
    .opt-pill { background: #1a221e; border: 1px solid #2c3e35; color: #e2ede7; padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .opt-pill.selected { background: var(--green); color: #07150c; border-color: var(--green); font-weight: 800; }
    .opt-pill.locked { opacity: .55; border-style: dashed; }

    table.lb { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.lb th { text-align: left; color: var(--muted); font-size: 11px; padding: 8px; border-bottom: 1px solid #22352b; }
    table.lb td { padding: 9px 8px; border-bottom: 1px solid rgba(255,255,255,.06); }
    .streak-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 9px; }
    .day-card { background: #19211d; border: 1px solid #2b3d34; border-radius: 12px; padding: 11px; text-align: center; }
    .day-card.claimed { border-color: var(--green); background: rgba(34,197,94,.12); }
    .day-card.today { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
    .cta-btn { background: var(--green); color: #06140b; border: 0; border-radius: 11px; padding: 11px 18px; font-weight: 800; cursor: pointer; font-size: 13px; width: 100%; margin-top: 10px; }
    .cta-btn.gold { background: var(--gold); color: #161104; }
    .field { width: 100%; background: #0D0D0D; border: 1px solid #2c4036; border-radius: 10px; padding: 10px 12px; color: #fff; font-size: 13px; margin-bottom: 10px; }
    .hint-bar { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.55); font-size: 11px; pointer-events: none; z-index: 15; }
    @media (max-width: 820px) {
      .hint-bar { display: none; }
      .chat-dock { width: 225px; max-height: 118px; bottom: 162px; }
      .event-banner { min-width: 170px; padding: 6px 10px; }
    }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="labels2d"></canvas>

  <div class="hud-top">
    <div class="left-stack">
      <canvas id="minimap" width="140" height="140"></canvas>
      <div class="perf-box">
        <div class="perf-title">
          <img src="/brand/mark_kecil_transparan_putih.png" alt="XyVerse" />
          <span>NYAWIT LIVE 3D</span>
        </div>
        <div id="perfStats">60 FPS · 12 DC · LIVE</div>
        <div class="pill-row" id="qualityRow">
          <span class="chip" data-q="0">SMOOTH</span>
          <span class="chip" data-q="1">STD</span>
          <span class="chip active" data-q="2">ULTRA</span>
          <span class="chip" data-q="3">MAX</span>
        </div>
      </div>
    </div>

    <div class="event-banner">
      <div class="event-tag" id="eventTitle">PANEN RAYA CERAH</div>
      <div class="wallet-row">
        <span><b class="rp" id="hudCoins">Rp 150.000</b></span>
        <span>TBS: <b class="tbs" id="hudCargo">0/12</b></span>
        <span>Permata: <b class="gem" id="hudGems">25</b></span>
      </div>
    </div>

    <div class="menu-buttons">
      <button class="mbtn" id="btnAvatar">Avatar 3D</button>
      <button class="mbtn" id="btnRank">Global Rank</button>
      <button class="mbtn gold" id="btnTourney">Turnamen</button>
      <button class="mbtn" id="btnDaily">Harian <span class="badge-dot" id="dailyDot"></span></button>
      <button class="mbtn" id="btnSocial">Sosial & Share</button>
      <a class="mbtn apk" href="/download/apk" target="_blank" rel="noopener">Download APK</a>
    </div>
  </div>

  <div class="chat-dock">
    <div class="chat-list" id="chatList"></div>
    <div class="chat-input-row">
      <input id="chatInput" maxlength="140" placeholder="Chat live kebun... (Enter)" />
      <button id="chatSend">KIRIM</button>
    </div>
  </div>

  <div class="joy-zone" id="joyZone"><div class="joy-knob" id="joyKnob"></div></div>

  <div class="action-cluster">
    <button class="abtn" id="btnTruck">NAIK<br/>CANTER</button>
    <button class="abtn sell" id="btnSell">SETOR<br/>RAM PKS</button>
    <button class="abtn" id="btnHorn">KLAKSON<br/>OLENG</button>
    <button class="abtn harvest" id="btnHarvest">EGREK<br/>PANEN!</button>
  </div>

  <div class="hint-bar">WASD / Joystick: Gerak & Stir Canter · Drag Layar: Kamera 3D · SPACE / E: Egrek Panen · F: Naik/Turun Truk · R: Setor PKS</div>
  <div class="toast" id="toast"></div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">PANEL</h2>
        <button class="close-btn" id="modalClose">X</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
