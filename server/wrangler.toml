name = "nyawit-live"
main = "src/worker.js"
compatibility_date = "2025-02-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "PLANTATION_HUB"
class_name = "PlantationHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlantationHub"]

[[routes]]
pattern = "nyawit.xyverse.my.id"
custom_domain = true

[vars]
PUBLIC_ORIGIN = "https://nyawit.xyverse.my.id"
GOOGLE_CLIENT_ID_WEB = "495336144977-cadhmro3bct9qtfahb2ajbj9ugb5scoa.apps.googleusercontent.com"
GITHUB_REPO = "xykal/nyawit-live"
