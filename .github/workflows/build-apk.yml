name: Build Nyawit Live 3D Android APK & Real Emulator Verification

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verify-and-release-apk:
    name: Native C11 NDK + .NET 10 Custom 3D Engine + Android 14 Emulator v3.0 Verification + Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Secret Hygiene & Zero Emoji Policy
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "FATAL: .env must never be tracked in git!"
            exit 1
          fi
          python3 -c '
          import os, re, sys
          rx = re.compile(r"[\U0001F000-\U0001FAFF\U00002600-\U000027BF\U0000FE0F\U00002300-\U000023FF\U00002B50\U00002B55]")
          exts = {".cs", ".js", ".html", ".css", ".md", ".py", ".yml", ".yaml", ".xml", ".json", ".toml", ".c", ".h"}
          bad = []
          for r, ds, fs in os.walk("."):
            ds[:] = [d for d in ds if d not in {".git", "node_modules", "bin", "obj", ".wrangler"}]
            for fn in fs:
              if os.path.splitext(fn)[1].lower() in exts:
                p = os.path.join(r, fn)
                txt = open(p, encoding="utf-8", errors="ignore").read()
                if rx.search(txt):
                  bad.append(p)
          if bad:
            print("FATAL: Emoji detected in:", bad)
            sys.exit(1)
          print("Secret hygiene & Zero-Emoji audit 100% clean across repository.")
          '

      - name: Setup Node.js 20 & Check Dedicated Server Syntax
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Cloudflare Dedicated Multiplayer & Voice Server Syntax
        working-directory: server
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Setup Java 21 (Temurin) for Android SDK 35/36 Build Tools
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup .NET 10 LTS SDK & Android Workload
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET Android Workload
        run: dotnet workload install android

      - name: Enable KVM Group Permissions for Hardware-Accelerated Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Compile Native C11 / SIMD Culler (arm64-v8a, armeabi-v7a, x86_64 & host x64)
        run: |
          mkdir -p src/Nyawit.Android/Libs/arm64-v8a \
                   src/Nyawit.Android/Libs/armeabi-v7a \
                   src/Nyawit.Android/Libs/x86_64 \
                   tests/NyawitEngine.Tests/bin/Release/net8.0

          gcc -O3 -std=c11 -Wall -Wextra -Werror -shared -fPIC native/nyawit_simd.c \
            -o tests/NyawitEngine.Tests/bin/Release/net8.0/libnyawit_simd.so

          NDK_ROOT="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          CLANG_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "Using Android NDK Clang from: $CLANG_BIN"

          "$CLANG_BIN/aarch64-linux-android24-clang" -O3 -ffast-math -std=c11 -Wall -Werror -shared -fPIC \
            native/nyawit_simd.c -lm -o src/Nyawit.Android/Libs/arm64-v8a/libnyawit_simd.so

          "$CLANG_BIN/armv7a-linux-androideabi24-clang" -O3 -ffast-math -std=c11 -Wall -Werror -shared -fPIC \
            native/nyawit_simd.c -lm -o src/Nyawit.Android/Libs/armeabi-v7a/libnyawit_simd.so

          "$CLANG_BIN/x86_64-linux-android24-clang" -O3 -ffast-math -std=c11 -Wall -Werror -shared -fPIC \
            native/nyawit_simd.c -lm -o src/Nyawit.Android/Libs/x86_64/libnyawit_simd.so

          ls -lh src/Nyawit.Android/Libs/*/*.so

      - name: Run Automated C# Engine, Physics, Suspension & Watertight NPAK v3.0 Tests
        run: dotnet test tests/NyawitEngine.Tests/NyawitEngine.Tests.csproj -c Release --verbosity normal

      - name: Prepare Release Signing Keystore
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/nyawit-release.p12"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          else
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storetype PKCS12 \
              -alias nyawitkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "NyawitLive2026!" \
              -keypass "NyawitLive2026!" \
              -dname "CN=Nyawit Live 3D, OU=Game Engine, O=XyVerse Tech, L=Jakarta, ST=DKI, C=ID"
          fi

      - name: Build & Sign True Universal v3.0.0 Release Android APK (arm64-v8a + armeabi-v7a + x86_64)
        run: |
          dotnet publish src/Nyawit.Android/Nyawit.Android.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            -p:AndroidCreatePackagePerAbi=false \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/nyawit-release.p12" \
            -p:AndroidSigningKeyAlias=nyawitkey \
            -p:AndroidSigningKeyPass="NyawitLive2026!" \
            -p:AndroidSigningStorePass="NyawitLive2026!"

          mkdir -p dist-apk
          SIGNED_APK=$(find src/Nyawit.Android/bin/Release -name "*-Signed.apk" | head -n 1)
          echo "Located signed APK: $SIGNED_APK"
          cp "$SIGNED_APK" dist-apk/NyawitLive-v3.0.0-universal.apk
          cp "$SIGNED_APK" dist-apk/NyawitLive-v2.0.0-universal.apk
          cp "$SIGNED_APK" dist-apk/NyawitLive-v1.0.0-universal.apk
          (cd dist-apk && sha256sum NyawitLive-v3.0.0-universal.apk NyawitLive-v2.0.0-universal.apk > SHA256SUMS.txt)

          echo "=== APK Archive Verification (3 Native ABIs + 105 Watertight NPAK v3.0 Meshes) ==="
          unzip -l dist-apk/NyawitLive-v3.0.0-universal.apk | grep -E "libnyawit_simd|nyawit_models.npak|XyVerseDisplay"
          ls -lh dist-apk/

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose dist-apk/NyawitLive-v3.0.0-universal.apk

      - name: Boot Real Android 14 (API 34) Emulator & Verify Lobby, Loading, TBS Hold & Canter Suspension
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tools/verify_android_emulator.py

      - name: Upload Verified v3.0.0 APK & Live Android 14 Screenshots Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NyawitLive-v3-Verified-Android-Bundle
          path: dist-apk/*
          if-no-files-found: warn

      - name: Publish Verified v3.0.0 Universal APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: "Nyawit Live 3D v3.0.0 — RigidBody Physics, 4-Wheel Suspension, Hold Animations, Lobby & Dedicated Server"
          make_latest: true
          body: |
            ## Nyawit Live 3D (`v3.0.0`) — Official Native Android Release & Dedicated Multiplayer/Voice Architecture
            - **Dedicated Android Client + Dedicated Server Domain (`https://nyawit.xyverse.my.id`)**: Browser WebGL client retired completely so gameplay never diverges; `nyawit.xyverse.my.id` serves 100% authoritative Multiplayer Sync (`8 Hz`), Multi-Room Lobby (`KEBUN SUMATERA #1`, `KEBUN RIAU #2`, `KALIMANTAN BARAT #3`, `SULTAN OLENG ARENA`), Global & Room Chat, Real-Time `8 kHz` Voice Relay (`G.711 u-law`), Global Leaderboards, Weekly Tournaments, and direct signed APK downloads (`/download/apk`).
            - **Zero Mesh Holes (`0% Bolong-Bolong`) & Ultra-Detailed 11-Part Human Anatomy (`NPAK v3.0` — `105` Watertight Meshes)**: Mathematically verified determinant-aware winding + signed-volume outward normals + shader double-sided normal flip; full human posture, head, face, eyes, eyebrows, nose, ears, hair, shoulders, elbows, hands/fingers, knees, and tall rubber boots.
            - **Solid RigidBody Physics (`0% Nembus`) & 4-Wheel Spring-Damper Canter Suspension**: Solid 3D collisions against every tree, rock, bridge, Mandor post, Angkong, Canter, RAM, and PKS building; independent 4-wheel spring-damper suspension, rolling tires, front-wheel steering up to `28 deg`, chassis pitch/roll ("Canter Oleng"), and bouncing harvested TBS fruits.
            - **Hold, Pickup & Cargo Load Animations**: Two-handed Egrek/Dodos grip, deep squat pickup of fallen TBS from ground, cradling spiky TBS in both hands, overhead parabolic throw into Canter truck bed or Angkong cart, pushing Angkong handles, and seated Canter driver steering pose.
            - **Sharp Chamfered Tactical HUD, Custom Vector Icons (Zero Emojis), 14 Tactile Click/Gameplay SFX, Live Voice Chat, 3D Main Lobby & `"MENYIAPKAN DUNIA..."` Loading Screen**.
          files: |
            dist-apk/NyawitLive-v3.0.0-universal.apk
            dist-apk/NyawitLive-v2.0.0-universal.apk
            dist-apk/SHA256SUMS.txt
